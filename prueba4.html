<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - prueba4.html</title>
    <style>
        :root {
            --primary: #06B6D4;
            --primary-hover: #0891B2;
            --bg-gradient: radial-gradient(circle at top left, #0F172A 0%, #020617 100%);
            --card-bg: rgba(30, 41, 59, 0.5);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --accent-glow: rgba(6, 182, 212, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .badge {
            display: inline-block;
            background: rgba(6, 182, 212, 0.15);
            color: #22D3EE;
            border: 1px solid rgba(34, 211, 238, 0.3);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #FFFFFF, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            background-color: var(--primary);
            color: #020617;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 24px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34D399;
            font-size: 0.875rem;
            display: none;
            font-weight: 500;
        }

        .footer-info {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #64748B;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">Prueba 4</span>
        <h1>¡Bienvenido!</h1>
        <p>Página <strong>prueba4.html</strong> cargada correctamente y lista para usar.</p>
        <button class="btn" onclick="ejecutarPrueba()">Verificar Estado</button>
        <div id="statusBox" class="status">✓ Conexión establecida: prueba4.html cargada exitosamente</div>
        <div class="footer-info" id="clock"></div>
    </div>

    <script>
        function ejecutarPrueba() {
            const statusBox = document.getElementById('statusBox');
            statusBox.style.display = 'block';
        }

        function actualizarHora() {
            const ahora = new Date();
            document.getElementById('clock').innerText = 'Hora local: ' + ahora.toLocaleTimeString();
        }
        actualizarHora();
        setInterval(actualizarHora, 1000);
    </script>

</body>
</html>
