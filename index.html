<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probabilidad en Tiempo Real - MLB</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #e2e8f0; text-align: center; padding: 40px 20px; }
        .card { background: #1e293b; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); padding: 30px; max-width: 500px; margin: 0 auto; }
        h1 { color: #38bdf8; margin-bottom: 25px; font-size: 24px; }
        label { display: block; text-align: left; margin-bottom: 8px; color: #94a3b8; font-size: 14px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { background-color: #38bdf8; color: #0f172a; border: none; padding: 14px 28px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #7dd3fc; }
        .resultado { margin-top: 25px; padding: 20px; border-radius: 10px; background: #0f172a; border: 1px solid #334155; }
        .prob-num { font-size: 42px; font-weight: bold; color: #4ade80; }
        .equipo { font-size: 18px; color: #f8fafc; margin-bottom: 5px; }
        .fuente { font-size: 12px; color: #64748b; margin-top: 15px; }
        .error { color: #f87171; }
        .loading { color: #94a3b8; font-style: italic; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚾ Probabilidad en Tiempo Real</h1>
        <p style="font-size: 13px; color: #94a3b8; text-align: left; margin-bottom: 20px;">Consulta los mercados de predicción de Polymarket para obtener la probabilidad implícita más actualizada.</p>
        
        <label for="nombreEquipo">Nombre del equipo (ej. Dodgers, Red Sox, Yankees):</label>
        <input type="text" id="nombreEquipo" placeholder="Escribe el nombre del equipo...">
        
        <button onclick="buscarProbabilidad()">Investigar Probabilidad</button>
        
        <div id="resultado" class="resultado" style="display: none;"></div>
    </div>

    <script>
        // Mapeo de nombres comunes a slugs de Polymarket (en minúsculas)
        const equiposSlugs = {
            'dodgers': 'lad', 'giants': 'sf', 'yankees': 'nyy', 'red sox': 'bos',
            'cubs': 'chc', 'mets': 'nym', 'braves': 'atl', 'astros': 'hou',
            'phillies': 'phi', 'padres': 'sd', 'mariners': 'sea', 'rangers': 'tex',
            'blue jays': 'tor', 'rays': 'tb', 'orioles': 'bal', 'guardians': 'cle',
            'twins': 'min', 'tigers': 'det', 'royals': 'kc', 'white sox': 'cws',
            'angels': 'laa', 'athletics': 'ath', 'rockies': 'col', 'diamondbacks': 'ari',
            'brewers': 'mil', 'reds': 'cin', 'pirates': 'pit', 'cardinals': 'stl',
            'nationals': 'wsh', 'marlins': 'mia'
        };

        async function buscarProbabilidad() {
            const input = document.getElementById('nombreEquipo');
            const resultadoDiv = document.getElementById('resultado');
            // Normalizar: quitar espacios extra y pasar a minúsculas
            const nombreEquipo = input.value.trim().toLowerCase().replace(/\s+/g, ' ');

            if (!nombreEquipo) {
                resultadoDiv.style.display = 'block';
                resultadoDiv.innerHTML = '<p class="error">Por favor, escribe el nombre de un equipo.</p>';
                return;
            }

            // Buscar el slug del equipo de forma flexible
            let slugEquipo = null;
            let nombreEncontrado = null;
            for (const [nombre, slug] of Object.entries(equiposSlugs)) {
                // Coincidencia flexible: si el nombre del equipo contiene el término o viceversa
                if (nombreEquipo.includes(nombre) || nombre.includes(nombreEquipo)) {
                    slugEquipo = slug;
                    nombreEncontrado = nombre;
                    break;
                }
            }

            if (!slugEquipo) {
                resultadoDiv.style.display = 'block';
                resultadoDiv.innerHTML = '<p class="error">Equipo no reconocido. Prueba con: Dodgers, Giants, Red Sox, Yankees, etc.</p>';
                return;
            }

            resultadoDiv.style.display = 'block';
            resultadoDiv.innerHTML = '<p class="loading">Consultando mercados de predicción...</p>';

            try {
                // Usar un proxy CORS público para evitar el bloqueo del navegador
                const urlAPI = 'https://gamma-api.polymarket.com/events?tag=mlb&active=true&closed=false&limit=100';
                const urlProxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(urlAPI);

                const respuesta = await fetch(urlProxy);
                if (!respuesta.ok) throw new Error('Error al consultar la API');

                const eventos = await respuesta.json();

                // Buscar el evento que involucre a nuestro equipo
                let mercadoEncontrado = null;
                
                for (const evento of eventos) {
                    const titulo = (evento.title || '').toLowerCase();
                    const slug = (evento.slug || '').toLowerCase();
                    
                    // Verificar si el equipo está en el título o slug del evento
                    if (titulo.includes(nombreEncontrado) || slug.includes(nombreEncontrado) || 
                        titulo.includes(slugEquipo) || slug.includes(slugEquipo)) {
                        
                        // Buscar dentro de los mercados del evento
                        if (evento.markets && evento.markets.length > 0) {
                            for (const mercado of evento.markets) {
                                // Buscar el mercado de moneyline (ganador del partido)
                                if (mercado.outcomes && mercado.outcomePrices) {
                                    mercadoEncontrado = {
                                        equipo: nombreEncontrado,
                                        evento: evento.title,
                                        mercado: mercado,
                                        fecha: evento.startDate
                                    };
                                    break;
                                }
                            }
                        }
                    }
                    if (mercadoEncontrado) break;
                }

                if (!mercadoEncontrado) {
                    resultadoDiv.innerHTML = `
                        <p class="equipo">🔍 No se encontró un partido activo para "${input.value}"</p>
                        <p style="font-size: 13px; color: #94a3b8; margin-top: 10px;">
                            Esto puede pasar si el equipo no juega hoy, si el partido ya terminó, 
                            o si no hay mercados abiertos en este momento.
                        </p>
                    `;
                    return;
                }

                // Extraer probabilidades del mercado
                const mercado = mercadoEncontrado.mercado;
                let precios = null;
                let outcomes = [];

                try {
                    precios = JSON.parse(mercado.outcomePrices);
                    outcomes = JSON.parse(mercado.outcomes);
                } catch (e) {
                    // Si no es JSON, dividir por comas
                    precios = mercado.outcomePrices.split(',').map(p => parseFloat(p));
                    outcomes = mercado.outcomes.split(',');
                }

                // Buscar el índice de nuestro equipo
                let indiceEquipo = -1;
                outcomes.forEach((outcome, i) => {
                    if (outcome.toLowerCase().includes(nombreEncontrado) || 
                        outcome.toLowerCase().includes(slugEquipo)) {
                        indiceEquipo = i;
                    }
                });

                // Si no encontramos el nombre exacto, asumir que el primer outcome es el equipo local o similar
                if (indiceEquipo === -1 && precios.length >= 2) {
                    indiceEquipo = 0;
                }

                const probabilidad = precios[indiceEquipo] ? Math.round(precios[indiceEquipo] * 100) : null;

                if (probabilidad !== null) {
                    resultadoDiv.innerHTML = `
                        <div class="equipo">${nombreEncontrado.toUpperCase()}</div>
                        <div class="prob-num">${probabilidad}%</div>
                        <div style="font-size: 14px; color: #94a3b8; margin-top: 10px;">
                            Probabilidad implícita de ganar
                        </div>
                        <div style="font-size: 13px; color: #64748b; margin-top: 15px; text-align: left;">
                            <p><strong>Partido:</strong> ${mercadoEncontrado.evento}</p>
                            <p><strong>Pregunta:</strong> ${mercado.question || 'Ganador del partido'}</p>
                        </div>
                        <p class="fuente">Fuente: Polymarket (mercado de predicción con dinero real)</p>
                    `;
                } else {
                    throw new Error('No se pudieron interpretar los precios');
                }

            } catch (error) {
                console.error('Error:', error);
                resultadoDiv.innerHTML = `
                    <p class="error">⚠️ Error al consultar los datos</p>
                    <p style="font-size: 13px; color: #94a3b8; margin-top: 10px;">
                        ${error.message}. 
                        <br><br>
                        Intenta de nuevo en unos momentos o consulta directamente:
                        <br>
                        <a href="https://polymarket.com" target="_blank" style="color: #38bdf8;">polymarket.com</a>
                    </p>
                `;
            }
        }

        // Permitir buscar con Enter
        document.getElementById('nombreEquipo').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarProbabilidad();
        });
    </script>
</body>
</html>
