<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerebro IA</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #2a2d34;
    font-weight: 600;
    font-size: 18px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 12px 14px;
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.4;
    word-break: break-word;
  }
  .user {
    align-self: flex-end;
    background: #3b6fd4;
    color: white;
  }
  .bot {
    align-self: flex-start;
    background: #1e2128;
    border: 1px solid #2a2d34;
  }
  .bot.loading { opacity: 0.6; font-style: italic; }
  .bot a {
    color: #6ea8fe;
    word-break: break-all;
  }
  .publicado {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(46, 204, 113, 0.15);
    border: 1px solid #2ecc71;
    border-radius: 8px;
    color: #2ecc71;
    font-weight: 600;
  }
  .publicado a {
    color: #2ecc71;
    text-decoration: underline;
  }
  .fallo {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(241, 196, 15, 0.15);
    border: 1px solid #f1c40f;
    border-radius: 8px;
    color: #f1c40f;
    font-weight: 600;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #2a2d34;
  }
  textarea {
    flex: 1;
    resize: none;
    border-radius: 10px;
    border: 1px solid #2a2d34;
    background: #1e2128;
    color: #e8e8e8;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
  }
  button {
    border: none;
    border-radius: 10px;
    background: #3b6fd4;
    color: white;
    padding: 0 18px;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>

<header>🧠 Cerebro IA</header>
<div id="chat"></div>

<form id="form">
  <textarea id="pregunta" rows="1" placeholder="Pregúntale o pídele algo..."></textarea>
  <button type="submit" id="enviar">Enviar</button>
</form>

<script>
  const SUPABASE_URL = "https://pnjglzuxsyahxcbgjwvq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuamdsenV4c3lhaHhjYmdqd3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjI0ODcsImV4cCI6MjA5NzEzODQ4N30.iD-yLgcC5GiGWQseAykLnONTCr1qA7kXSWgqVQ3-gfM";
  const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/cerebro`;

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("pregunta");
  const boton = document.getElementById("enviar");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatearRespuestaBot(texto) {
    let seguro = escapeHtml(texto);

    seguro = seguro.replace(
      /✅ Publicado en: (https?:\/\/\S+)/,
      '<div class="publicado">✅ Publicado en: <a href="$1" target="_blank" rel="noopener">$1</a></div>'
    );
    seguro = seguro.replace(
      /⚠️ No se pudo publicar: (.+)/,
      '<div class="fallo">⚠️ No se pudo publicar: $1</div>'
    );

    seguro = seguro.replace(
      /(https?:\/\/[^\s<]+)(?![^<]*>)/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>'
    );

    return seguro;
  }

  function agregarMensajeUsuario(texto) {
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = texto;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function agregarMensajeBot(texto, cargando) {
    const div = document.createElement("div");
    div.className = "msg bot" + (cargando ? " loading" : "");
    if (cargando) {
      div.textContent = texto;
    } else {
      div.innerHTML = formatearRespuestaBot(texto);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pregunta = input.value.trim();
    if (!pregunta) return;

    agregarMensajeUsuario(pregunta);
    input.value = "";
    boton.disabled = true;
    const cargando = agregarMensajeBot("Pensando...", true);

    try {
      const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + SUPABASE_ANON_KEY,
          "apikey": SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ pregunta }),
      });
      const data = await res.json();
      cargando.remove();
      agregarMensajeBot(data.respuesta || data.error || "No hubo respuesta.", false);
    } catch (err) {
      cargando.remove();
      agregarMensajeBot("Error al conectar con el bot: " + err.message, false);
    } finally {
      boton.disabled = false;
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
</script>

</body>
</html>
