<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Avanzada</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --display-bg: #090d16;
      --btn-bg: #334155;
      --btn-hover: #475569;
      --btn-active: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-sec: #06b6d4;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .calculator-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 2px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mode-badge {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent);
      text-transform: uppercase;
      cursor: pointer;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      color: var(--text);
      background: var(--btn-bg);
    }

    .display {
      background: var(--display-bg);
      border-radius: 16px;
      padding: 16px 20px;
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 110px;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .display .expression {
      font-size: 1rem;
      color: var(--text-dim);
      min-height: 24px;
      margin-bottom: 4px;
    }

    .display .result {
      font-size: 2.25rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .memory-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button.btn-sm {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-dim);
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 0;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button.btn-sm:hover {
      background: var(--btn-bg);
      color: var(--text);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .keypad.scientific {
      grid-template-columns: repeat(5, 1fr);
    }

    button.btn {
      background: var(--btn-bg);
      color: var(--text);
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 500;
      padding: 16px 0;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    button.btn:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }

    button.btn:active {
      background: var(--btn-active);
      transform: translateY(1px);
    }

    button.btn.op {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }
    button.btn.op:hover { background: rgba(59, 130, 246, 0.3); }

    button.btn.fn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-dim);
      font-size: 0.95rem;
    }
    button.btn.fn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); }

    button.btn.equals {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    button.btn.equals:hover { background: var(--accent-hover); }

    button.btn.clear {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }
    button.btn.clear:hover { background: rgba(239, 68, 68, 0.3); }

    .history-panel {
      position: absolute;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      z-index: 10;
      transition: right 0.3s ease;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .history-panel.open {
      right: 0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-item {
      background: var(--display-bg);
      padding: 12px;
      border-radius: 10px;
      text-align: right;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border 0.2s;
    }

    .history-item:hover {
      border-color: var(--accent);
    }

    .history-expr {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .history-res {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-sec);
    }

    .empty-history {
      text-align: center;
      color: var(--text-dim);
      margin-top: 40px;
    }

    @media (max-width: 400px) {
      .calculator-container { padding: 16px; }
      button.btn { padding: 12px 0; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="calculator-container">
    <div class="top-bar">
      <span class="mode-badge" id="angle-mode" onclick="toggleAngleMode()">DEG</span>
      <div class="top-actions">
        <button class="icon-btn" onclick="toggleSciMode()" title="Modo científico / estándar">🔬</button>
        <button class="icon-btn" onclick="toggleHistory()" title="Historial">📜</button>
      </div>
    </div>

    <div class="display">
      <div class="expression" id="display-expr"></div>
      <div class="result" id="display-res">0</div>
    </div>

    <div class="memory-bar">
      <button class="btn-sm" onclick="memoryClear()" title="Limpiar Memoria">MC</button>
      <button class="btn-sm" onclick="memoryRecall()" title="Recuperar Memoria">MR</button>
      <button class="btn-sm" onclick="memoryAdd()" title="Sumar a Memoria">M+</button>
      <button class="btn-sm" onclick="memorySubtract()" title="Restar de Memoria">M-</button>
    </div>

    <div class="keypad" id="keypad"></div>

    <div class="history-panel" id="history-panel">
      <div class="history-header">
        <h3>Historial</h3>
        <div>
          <button class="icon-btn" onclick="clearHistory()" title="Limpiar historial">🗑️</button>
          <button class="icon-btn" onclick="toggleHistory()">✕</button>
        </div>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-history">Sin cálculos recientes</div>
      </div>
    </div>
  </div>

  <script>
    let currentExpression = '';
    let isSciMode = false;
    let isDeg = true;
    let history = [];
    let memory = 0;

    const displayExpr = document.getElementById('display-expr');
    const displayRes = document.getElementById('display-res');
    const keypad = document.getElementById('keypad');
    const angleBadge = document.getElementById('angle-mode');
    const historyPanel = document.getElementById('history-panel');
    const historyList = document.getElementById('history-list');

    const standardKeys = [
      { label: 'AC', class: 'btn clear', action: 'clearAll()' },
      { label: '⌫', class: 'btn fn', action: 'deleteChar()' },
      { label: '%', class: 'btn fn', action: "appendInput('%')" },
      { label: '÷', class: 'btn op', action: "appendInput('/')" },

      { label: '7', class: 'btn', action: "appendInput('7')" },
      { label: '8', class: 'btn', action: "appendInput('8')" },
      { label: '9', class: 'btn', action: "appendInput('9')" },
      { label: '×', class: 'btn op', action: "appendInput('*')" },

      { label: '4', class: 'btn', action: "appendInput('4')" },
      { label: '5', class: 'btn', action: "appendInput('5')" },
      { label: '6', class: 'btn', action: "appendInput('6')" },
      { label: '-', class: 'btn op', action: "appendInput('-')" },

      { label: '1', class: 'btn', action: "appendInput('1')" },
      { label: '2', class: 'btn', action: "appendInput('2')" },
      { label: '3', class: 'btn', action: "appendInput('3')" },
      { label: '+', class: 'btn op', action: "appendInput('+')" },

      { label: '0', class: 'btn', action: "appendInput('0')" },
      { label: '.', class: 'btn', action: "appendInput('.')" },
      { label: '(', class: 'btn fn', action: "appendInput('(')" },
      { label: '=', class: 'btn equals', action: 'calculate()' }
    ];

    const scientificKeys = [
      { label: 'sin', class: 'btn fn', action: "appendInput('sin(')" },
      { label: 'cos', class: 'btn fn', action: "appendInput('cos(')" },
      { label: 'tan', class: 'btn fn', action: "appendInput('tan(')" },
      { label: 'AC', class: 'btn clear', action: 'clearAll()' },
      { label: '⌫', class: 'btn fn', action: 'deleteChar()' },

      { label: 'ln', class: 'btn fn', action: "appendInput('ln(')" },
      { label: 'log', class: 'btn fn', action: "appendInput('log(')" },
      { label: '√', class: 'btn fn', action: "appendInput('√(')" },
      { label: '^', class: 'btn fn', action: "appendInput('^')" },
      { label: '÷', class: 'btn op', action: "appendInput('/')" },

      { label: 'π', class: 'btn fn', action: "appendInput('π')" },
      { label: '7', class: 'btn', action: "appendInput('7')" },
      { label: '8', class: 'btn', action: "appendInput('8')" },
      { label: '9', class: 'btn', action: "appendInput('9')" },
      { label: '×', class: 'btn op', action: "appendInput('*')" },

      { label: 'e', class: 'btn fn', action: "appendInput('e')" },
      { label: '4', class: 'btn', action: "appendInput('4')" },
      { label: '5', class: 'btn', action: "appendInput('5')" },
      { label: '6', class: 'btn', action: "appendInput('6')" },
      { label: '-', class: 'btn op', action: "appendInput('-')" },

      { label: 'x!', class: 'btn fn', action: "appendInput('!')" },
      { label: '1', class: 'btn', action: "appendInput('1')" },
      { label: '2', class: 'btn', action: "appendInput('2')" },
      { label: '3', class: 'btn', action: "appendInput('3')" },
      { label: '+', class: 'btn op', action: "appendInput('+')" },

      { label: '(', class: 'btn fn', action: "appendInput('(')" },
      { label: ')', class: 'btn fn', action: "appendInput(')')" },
      { label: '0', class: 'btn', action: "appendInput('0')" },
      { label: '.', class: 'btn', action: "appendInput('.')" },
      { label: '=', class: 'btn equals', action: 'calculate()' }
    ];

    function renderKeypad() {
      keypad.innerHTML = '';
      const keys = isSciMode ? scientificKeys : standardKeys;

      if (isSciMode) {
        keypad.classList.add('scientific');
      } else {
        keypad.classList.remove('scientific');
      }

      keys.forEach(k => {
        const btn = document.createElement('button');
        btn.className = k.class;
        btn.textContent = k.label;
        btn.setAttribute('onclick', k.action);
        keypad.appendChild(btn);
      });
    }

    function toggleSciMode() {
      isSciMode = !isSciMode;
      renderKeypad();
    }

    function toggleAngleMode() {
      isDeg = !isDeg;
      angleBadge.textContent = isDeg ? 'DEG' : 'RAD';
    }

    function appendInput(val) {
      currentExpression += val;
      updateDisplay();
    }

    function deleteChar() {
      if (currentExpression.length > 0) {
        if (currentExpression.endsWith('sin(') || currentExpression.endsWith('cos(') || currentExpression.endsWith('tan(') || currentExpression.endsWith('log(')) {
          currentExpression = currentExpression.slice(0, -4);
        } else if (currentExpression.endsWith('ln(') || currentExpression.endsWith('√(')) {
          currentExpression = currentExpression.slice(0, -3);
        } else {
          currentExpression = currentExpression.slice(0, -1);
        }
        updateDisplay();
      }
    }

    function clearAll() {
      currentExpression = '';
      displayRes.textContent = '0';
      updateDisplay();
    }

    function updateDisplay() {
      displayExpr.textContent = formatDisplay(currentExpression);
    }

    function formatDisplay(expr) {
      return expr
        .replace(/\*/g, ' × ')
        .replace(/\//g, ' ÷ ')
        .replace(/\+/g, ' + ')
        .replace(/-/g, ' - ')
        .replace(/\^/g, ' ^ ');
    }

    function memoryClear() { memory = 0; }
    function memoryRecall() { appendInput(memory.toString()); }
    function memoryAdd() {
      const val = parseFloat(displayRes.textContent);
      if (!isNaN(val)) memory += val;
    }
    function memorySubtract() {
      const val = parseFloat(displayRes.textContent);
      if (!isNaN(val)) memory -= val;
    }

    function toggleHistory() {
      historyPanel.classList.toggle('open');
    }

    function clearHistory() {
      history = [];
      renderHistory();
    }

    function addHistory(expr, res) {
      history.unshift({ expr, res });
      if (history.length > 20) history.pop();
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<div class="empty-history">Sin cálculos recientes</div>';
        return;
      }
      historyList.innerHTML = history.map((item, idx) => `
        <div class="history-item" onclick="loadHistoryItem(${idx})">
          <div class="history-expr">${formatDisplay(item.expr)} =</div>
          <div class="history-res">${item.res}</div>
        </div>
      `).join('');
    }

    function loadHistoryItem(idx) {
      const item = history[idx];
      currentExpression = item.res.toString();
      updateDisplay();
      toggleHistory();
    }

    function factorial(n) {
      if (n < 0) return NaN;
      if (n === 0 || n === 1) return 1;
      let result = 1;
      for (let i = 2; i <= n; i++) result *= i;
      return result;
    }

    function _sin(x) { return isDeg ? Math.sin(x * Math.PI / 180) : Math.sin(x); }
    function _cos(x) { return isDeg ? Math.cos(x * Math.PI / 180) : Math.cos(x); }
    function _tan(x) { return isDeg ? Math.tan(x * Math.PI / 180) : Math.tan(x); }
    function _log(x) { return Math.log10(x); }
    function _ln(x) { return Math.log(x); }
    function _sqrt(x) { return Math.sqrt(x); }

    function calculate() {
      if (!currentExpression) return;

      try {
        let expr = currentExpression;

        expr = expr.replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E');

        expr = expr
          .replace(/sin\(/g, '_sin(')
          .replace(/cos\(/g, '_cos(')
          .replace(/tan\(/g, '_tan(')
          .replace(/log\(/g, '_log(')
          .replace(/ln\(/g, '_ln(')
          .replace(/√\(/g, '_sqrt(');

        expr = expr.replace(/(\d+(\.\d+)?)\!/g, 'factorial($1)');
        expr = expr.replace(/\^/g, '**');
        expr = expr.replace(/(\d+(\.\d+)?)%/g, '($1/100)');

        const evalFn = new Function('_sin', '_cos', '_tan', '_log', '_ln', '_sqrt', 'factorial', `return ${expr};`);
        let rawResult = evalFn(_sin, _cos, _tan, _log, _ln, _sqrt, factorial);

        if (isNaN(rawResult) || !isFinite(rawResult)) {
          throw new Error('Indefinido');
        }

        let finalResult = Math.round(rawResult * 1e10) / 1e10;

        displayRes.textContent = finalResult;
        addHistory(currentExpression, finalResult);
        currentExpression = finalResult.toString();

      } catch (err) {
        displayRes.textContent = 'Error';
      }
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key >= '0' && key <= '9') appendInput(key);
      else if (key === '.') appendInput('.');
      else if (key === '+') appendInput('+');
      else if (key === '-') appendInput('-');
      else if (key === '*') appendInput('*');
      else if (key === '/') { e.preventDefault(); appendInput('/'); }
      else if (key === '%') appendInput('%');
      else if (key === '(' || key === ')') appendInput(key);
      else if (key === '^') appendInput('^');
      else if (key === 'Enter' || key === '=') { e.preventDefault(); calculate(); }
      else if (key === 'Backspace') deleteChar();
      else if (key === 'Escape') clearAll();
    });

    renderKeypad();
  </script>
</body>
</html>
