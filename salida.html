<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación 5</title>
    <style>
        :root {
            --bg-color: #0a0e17;
            --card-bg: #111827;
            --accent-color: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 24px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .details-box {
            background-color: #0b1120;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            font-family: monospace;
            font-size: 0.85rem;
            color: #d1d5db;
            margin-bottom: 24px;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .details-row:last-child {
            margin-bottom: 0;
        }

        .details-label {
            color: var(--text-muted);
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">
            <span class="status-dot"></span>
            VERIFICACIÓN OK
        </div>

        <h1>Página de Prueba #5</h1>
        <p>Esta es una página de prueba generada para verificar la conectividad y el despliegue correcto del sistema.</p>

        <div class="details-box">
            <div class="details-row">
                <span class="details-label">Archivo:</span>
                <span>verificacion5.html</span>
            </div>
            <div class="details-row">
                <span class="details-label">Estado HTTP:</span>
                <span>200 OK</span>
            </div>
            <div class="details-row">
                <span class="details-label">Hora local:</span>
                <span id="timestamp">Cargando...</span>
            </div>
            <div class="details-row">
                <span class="details-label">Latencia simulada:</span>
                <span id="ping">-- ms</span>
            </div>
        </div>

        <button class="btn" onclick="ejecutarPrueba()">Ejecutar Test de Estado</button>
    </div>

    <script>
        function actualizarHora() {
            const ahora = new Date();
            document.getElementById('timestamp').textContent = ahora.toLocaleTimeString();
        }

        function ejecutarPrueba() {
            const pingElem = document.getElementById('ping');
            pingElem.textContent = 'Midiendo...';
            
            setTimeout(() => {
                const ms = Math.floor(Math.random() * (45 - 12 + 1)) + 12;
                pingElem.textContent = ms + ' ms';
                alert('Prueba completada: El sistema está respondiendo correctamente.');
            }, 500);
        }

        actualizarHora();
        setInterval(actualizarHora, 1000);
    </script>
</body>
</html>
